[project]
name = "note-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "PyMySQL>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "charset-normalizer>=3.4,<4",
  "defusedxml>=0.7,<1",
  "Pillow>=11,<13",
  "pypdf>=6,<7",
  "pypdfium2>=4.30,<5",
  "rapidocr>=3.9,<4",
  "onnxruntime==1.22.1; sys_platform == 'darwin'",
  "onnxruntime>=1.20,<2; sys_platform != 'darwin'",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "httpx>=0.28,<1"]
desktop = ["pyinstaller>=6.14,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
