[project]
name = "note-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "PyMySQL>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

