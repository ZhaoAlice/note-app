server:
  host: 127.0.0.1
  port: 8000
  debug: false
  trusted_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
  frontend_dist: ../frontend/dist
database:
  url: sqlite:///./data/notebook.db
  echo: false
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
storage:
  upload_dir: ./data/uploads
  max_file_bytes: 10485760
security:
  session_cookie: note_session
  csrf_cookie: note_csrf
  session_days: 30
  cookie_secure: false
  pbkdf2_iterations: 600000

