name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit locked frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org

  backend:
    name: Backend Python audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
      - name: Export locked production dependencies
        working-directory: backend
        run: uv export --frozen --no-dev --no-hashes --no-emit-project --output-file "${RUNNER_TEMP}/requirements.txt"
      - name: Audit locked backend dependencies
        run: uvx --from pip-audit==2.10.0 pip-audit --requirement "${RUNNER_TEMP}/requirements.txt" --strict --progress-spinner=off
